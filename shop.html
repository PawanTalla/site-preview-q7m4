(function () {
  if (/[?&](t|no)=|[?&]pet=cat|[?&]f=(cat|jerky|soft|freeze|big)/.test(location.search)) return;
  var Z = '(max-width: 760px) 46vw, (max-width: 1100px) 30vw, 290px';
  [['img/v2/shop/m/sampler-bags-360.webp 360w, img/v2/shop/sampler-bags.webp 640w', 'img/v2/shop/sampler-bags.webp'],
   ['img/v2/shop/m/sweet-potato-360.webp 360w, img/treat/sweet-potato-500.webp 500w', 'img/treat/sweet-potato-500.webp']].forEach(function (x) {
    var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = x[1];
    l.setAttribute('imagesrcset', x[0]); l.setAttribute('imagesizes', Z); l.setAttribute('fetchpriority', 'high');
    document.head.appendChild(l);
  });
})();
</script>
